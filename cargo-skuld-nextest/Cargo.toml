[package]
name = "cargo-skuld-nextest"
version = "0.2.1"
edition = "2021"
authors = ["Anna Zhukova"]
description = "Generate nextest test-groups from Skuld's serial test coordination metadata"
license = "Apache-2.0"
license-file = "../LICENSE.md"
repository = "https://github.com/bindreams/skuld"

[[bin]]
name = "cargo-skuld-nextest"
path = "src/main.rs"

[dependencies]
skuld = { version = "=0.2.1", path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
petgraph = "0.6"
blake3 = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
