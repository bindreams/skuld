# Spike for #121: can plain OS file locks replace bundled C SQLite for skuld's
# cross-process coordination? Standalone (own [workspace]); not part of skuld's
# build. Nothing here needs a C compiler.
[package]
name = "locks-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
