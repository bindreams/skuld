# Spike for #121: can Turso replace bundled C SQLite for skuld's cross-process
# coordination? Standalone (own [workspace]); not part of skuld's build.
[package]
name = "turso-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
# Mixed rusqlite/Turso scenarios. Needs a C compiler, so it's off for the
# cross-target builds this spike exists to prove.
interop = ["dep:rusqlite"]

[dependencies]
turso = { version = "=0.9.0-pre.5", default-features = false, features = ["pure-rust-crypto"] }
pollster = "0.4"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
