name: Set up Rust build environment
description: Installs stable Rust, caches cargo registry, configures sccache.
inputs:
  toolchain:
    description: "Toolchain for dtolnay/rust-toolchain: 'stable' or an exact X.Y.Z"
    required: false
    default: "stable"
  components:
    description: "Extra rustup components (e.g. 'clippy, rustfmt')"
    required: false
    default: ""
  targets:
    description: "Rust target triple(s)"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      id: rust-toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # dtolnay's `rustup default` step tolerates failure, which would silently
    # leave the runner's preinstalled toolchain in place. When an exact version
    # was asked for, refuse that.
    - name: Check the requested toolchain is the one running
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [[ "$TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          actual=$(cargo --version | cut -d ' ' -f2)
          if [ "$actual" != "$TOOLCHAIN" ]; then
            echo "::error::Requested toolchain ${TOOLCHAIN} but cargo ${actual} is running."
            exit 1
          fi
        fi

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-

    - name: Configure sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Enable sccache for cargo
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

    - name: Log toolchain versions
      shell: bash
      run: |
        rustc --version
        cargo --version
