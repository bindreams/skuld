name: Set up Rust build environment
description: Installs the requested Rust toolchain (default stable), caches cargo registry, configures sccache.
inputs:
  toolchain:
    description: "'stable' or an exact X.Y.Z. Ignored when pin-file is set."
    required: false
    default: "stable"
  pin-file:
    description: "Release toolchain pin file to install instead of `toolchain`"
    required: false
    default: ""
  components:
    description: "Extra rustup components (e.g. 'clippy, rustfmt')"
    required: false
    default: ""
  targets:
    description: "Rust target triple(s)"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read the toolchain pin
      id: pin
      if: inputs.pin-file != ''
      uses: ./.github/actions/read-toolchain-pin
      with:
        file: ${{ inputs.pin-file }}

    - name: Install Rust toolchain
      id: rust-toolchain
      uses: ./.github/actions/install-toolchain
      with:
        toolchain: ${{ steps.pin.outputs.version || inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-

    - name: Configure sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.18.0

    - name: Enable sccache for cargo
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

    - name: Log toolchain versions
      shell: bash
      run: |
        rustc --version
        cargo --version
