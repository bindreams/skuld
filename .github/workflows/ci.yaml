name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: Probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Probe
        run: cargo test -p skuld --lib adv_probe -- --nocapture --test-threads=1
