name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required so `cargo xtask version --check`
          # (run via the prek hook) can see ancestor tags. Default depth 1
          # with no tags would make the check silently always-pass.
          fetch-depth: 0

      # setup-rust is still needed so the cargo-fmt / cargo-clippy /
      # cargo-xtask-version hooks inside prek can find a Rust toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # Single source of truth for lint is prek.toml — the same checks run
      # locally as pre-commit hooks, shellcheck's optional checks included:
      # the actionlint hook carries them as its own `env`. prek-action runs
      # `prek run --all-files` with `--show-diff-on-failure --color=always`,
      # so fmt / mixed-line-ending failures surface as a diff in CI logs.
      # prek.toml's own `shellcheck-on-path` hook (not a step here) asserts
      # shellcheck is reachable, so that check runs identically in CI and
      # locally instead of living only in this file.
      - name: Derive pinned shellcheck version from prek.toml
        # actionlint's shellcheck (see prek.toml) is not the shellcheck-py
        # hook's own binary — it shells out to whatever `shellcheck` is on
        # PATH, so CI needs its own install. Parse the version straight out
        # of prek.toml's shellcheck-py `rev` instead of pinning a second copy
        # by hand, so there's one number to bump, not two to keep in step.
        id: shellcheck-pin
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import tomllib

          with open("prek.toml", "rb") as f:
              data = tomllib.load(f)
          rev = next(
              r["rev"]
              for r in data["repos"]
              if r.get("repo") == "https://github.com/shellcheck-py/shellcheck-py"
          )
          # shellcheck-py tags as v<shellcheck-version>.<pypi-patch>, e.g.
          # v0.11.0.1 wraps shellcheck 0.11.0 -- drop the trailing segment.
          print(".".join(rev.lstrip("v").split(".")[:-1]))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # actionlint's shellcheck integration silently degrades if the binary is
      # missing (see prek.toml) — install it explicitly and verify.
      - name: Install shellcheck
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck@${{ steps.shellcheck-pin.outputs.version }}

      # .shellcheckrc's `enable=` line (and its copy as SHELLCHECK_OPTS in
      # prek.toml's actionlint hook) is the only thing turning on SC2249 and
      # SC2312. shellcheck silently no-ops on an unrecognized enable= name, so
      # a typo, or an upstream rename/removal of either check, would drop
      # coverage with this job staying green. Prove both still fire against a
      # fixture built to trip each of them.
      - name: Assert shellcheck's optional checks still fire
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp)
          trap 'rm -f "$fixture"' EXIT
          cat <<'SH' > "$fixture"
          #!/bin/sh
          case "$1" in
            x) echo x ;;
          esac
          if [ "$(false)" ]; then echo hi; fi
          SH
          out=$(shellcheck --enable=add-default-case,check-extra-masked-returns "$fixture" 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::shellcheck did not flag a fixture built to trip SC2249 and SC2312 -- the optional checks may have stopped being recognized"
            exit 1
          fi
          for code in SC2249 SC2312; do
            if ! grep -q "$code" <<<"$out"; then
              echo "::error::Expected $code in shellcheck's output but it was missing:"
              echo "$out"
              exit 1
            fi
          done

      - uses: j178/prek-action@v3.0.0

  test:
    name: Test (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: darwin
            arch: amd64
            runner: macos-15
            target: x86_64-apple-darwin
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build workspace
        # Exclude xtask from the matrix: it's a dev tool run only on the lint
        # host (Linux), and its deps aren't worth cross-compiling to 6 targets.
        run: cargo build --workspace --exclude xtask --target ${{ matrix.target }}

      - name: Unit tests
        run: cargo test --workspace --exclude xtask --target ${{ matrix.target }}

      # xtask is excluded from the matrix above (it is a Linux-side build tool,
      # not a shipped artifact), so without this its tests run nowhere — including
      # the version and pin checks that gate an irreversible publish.
      - name: Test xtask
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: cargo test -p xtask

      # The fixture workspace under cargo-skuld resolves independently and
      # path-depends on the workspace version, so its lock goes stale at every
      # bump — and the tests silently rewrite it. Nothing else notices: no job
      # runs --locked there.
      - name: Fixture lock is current
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: git diff --exit-code -- cargo-skuld/tests/fixtures/test-workspace/Cargo.lock
