name: CI

on:
  pull_request:

jobs:
  probe:
    name: Probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: GREEN
        run: cargo test -p skuld --lib -- windows_probe_tests
      - name: Mutant (no directory delete-pending check)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/ && !delete_pending(&handle)?//' src/coordination/db_dir/windows_probe.rs
          git diff --stat
          cargo test -p skuld --lib -- windows_probe_tests
