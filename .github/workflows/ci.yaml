name: CI

on:
  pull_request:

jobs:
  probe:
    name: Mutants (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: GREEN
        run: cargo test -p skuld --lib -- windows_probe_tests
      - name: "M1: no FILE_DELETE_ON_CLOSE"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src
          sed -i 's/FILE_DELETE_ON_CLOSE | FILE_SYNCHRONOUS_IO_NONALERT/FILE_SYNCHRONOUS_IO_NONALERT/' src/coordination/db_dir/windows_probe.rs
          git diff --stat
          cargo test -p skuld --lib -- windows_probe_tests
      - name: "M2: retry on every STATUS_DELETE_PENDING"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src
          sed -i 's/                true => return Err(being_deleted(status)),/                true => continue,/' src/coordination/db_dir/windows_probe.rs
          git diff --stat
          cargo test -p skuld --lib -- windows_probe_tests
