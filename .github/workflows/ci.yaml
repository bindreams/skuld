name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: Probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Probes
        run: cargo test -p skuld --lib adv_ -- --test-threads=1 --nocapture
