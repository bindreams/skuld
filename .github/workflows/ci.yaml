name: CI

on:
  pull_request:

jobs:
  mutant:
    name: Mutant a (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: GREEN
        run: cargo test -p skuld --lib -- temp_dir_tests
      - name: "Mutant a: no explicit std::path::absolute"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src
          sed -i 's/let parent = std::path::absolute(parent).map_err(|e| io::Error::new(e.kind(), format!("{e}: {parent:?}")))?;/let parent = parent.to_path_buf();/' src/fixtures/temp_dir.rs
          git diff --stat
          cargo test -p skuld --lib -- temp_dir_tests
