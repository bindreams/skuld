name: CI

on:
  pull_request:

jobs:
  adv92:
    name: adv92 (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Token privileges
        continue-on-error: true
        shell: cmd
        run: whoami /priv
      - name: Baseline
        run: |
          set +e
          cargo test --lib -p skuld coordination::db_dir:: -- --nocapture --test-threads=1 > base.log 2>&1; echo "exit=$?"
          grep -E "ADV92|^test |test result|panicked" base.log
