name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    # Deliberately no *job-level* `timeout-minutes` — the steps before the
    # upload carry their own instead. A job deadline spans the publish step,
    # and crates.io commits each upload server-side, so cancelling part-way
    # through leaves the workspace partially published with no tag: the state
    # the timeout would exist to avoid, caused by the timeout. A job timer starts before the token is minted, and
    # the only case where it could bite is a cold cache (`cargo publish
    # --workspace` runs a full verification build of all three crates, and
    # rusqlite's bundled SQLite is not fast) — which also slows every step
    # ahead of it, so it would arrive earliest exactly when least wanted.
    #
    # Two deadlines remain that no timeout setting here can remove: the minted
    # token lives ~30 minutes, and GitHub caps any job at 6 hours. Both span
    # the upload. What keeps them from mattering is the step order below — the
    # verification build runs before the token is minted, so only the uploads
    # themselves race the credential. Should one still expire mid-upload, the
    # run stops without the RELEASE COMPLETE marker, and CONTRIBUTING.md's
    # recovery section covers that state.
    #
    # The Deploy environment is named in each crate's crates.io trusted-publisher
    # config, so the OIDC token minted below is only accepted from a run that
    # declares it.
    #
    # It has no protection rules or deployment branch policy today, so it is
    # not an authorization control — see "Open action item" in CONTRIBUTING.md.
    #
    # Real preflight (version validation, CI matrix, cargo publish dry-run)
    # happens in draft-release.yaml before a draft can exist. This workflow
    # assumes the operator has already reviewed the draft and is committing
    # to publishing — so we don't duplicate preflight here.
    environment: Deploy
    permissions:
      # `write` is required (not just `read`) so the List releases API
      # returns drafts: per GitHub docs, drafts are only returned "if the
      # user has push access", which means write-level auth.
      contents: write
      # Lets the runner mint the OIDC JWT that crates.io exchanges for a
      # short-lived publish token. Both scopes must be listed: declaring any
      # `permissions:` block sets every unlisted scope to `none`.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Normalize and validate version
        id: version
        timeout-minutes: 5
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Reject a leading `v` rather than stripping it. The raw input is the
          # concurrency key, so if `1.2.3` and `v1.2.3` both normalized to one
          # version they would land in *different* groups while naming the same
          # release — two runs of the same publish, in parallel, on an operation
          # that cannot be undone. One accepted spelling keeps key and meaning
          # in step.
          # Leading zeros are rejected too: `01.2.3` is not valid semver, so
          # `semver::Version::parse` fails on it and xtask's tag map silently
          # skips such a tag — the one check tying input to manifest would
          # no-op for exactly those spellings.
          if ! [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version: '${INPUT_VERSION}'. Expected three dot-separated numbers with no leading zeros, no leading 'v', and no pre-release or build suffix (e.g. 1.2.3)."
            exit 1
          fi
          V="$INPUT_VERSION"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - name: Verify draft release exists and resolve commit SHA
        id: release
        # Every step ahead of the upload is bounded, so a hung run cannot sit on
        # the concurrency group until GitHub's 6-hour cap. The upload itself and
        # the draft flip are deliberately unbounded: see the note on the job.
        timeout-minutes: 5
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! RELEASE_JSON=$(gh release view "$TAG" --json isDraft,targetCommitish); then
            echo "::error::gh release view failed for $TAG. Does the draft release exist?"
            exit 1
          fi

          IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release $TAG is already published"
            exit 1
          fi

          TARGET=$(echo "$RELEASE_JSON" | jq -r '.targetCommitish')
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Draft release target '$TARGET' is not a 40-char commit SHA. Recreate the draft via the Draft Release workflow."
            exit 1
          fi
          echo "commit_sha=$TARGET" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          ref: ${{ steps.release.outputs.commit_sha }}
          # fetch-depth: 0 so `cargo xtask version --check --exact` sees
          # all ancestor tags, not just the one we're about to create.
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust
        timeout-minutes: 15

      - name: Re-verify workspace version matches release
        timeout-minutes: 20
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$TAG"
          cargo xtask version --check --exact

          # `--exact` alone does not tie the input to the manifest. It is
          # satisfied by ANY version tag on the nearest tagged ancestor, so once
          # that commit carries a tag matching the manifest, the tag created
          # just above is merely one more alternative and any input passes.
          # That is live today: main sits on the v0.3.1 commit.
          #
          # Stage 1 gates this, but stage 1's verdict is only transitive — it
          # applies to the commit the draft recorded, and this job already
          # treats the draft's target as mutable (which is why the flip below
          # re-asserts the SHA). Re-assert the version against the tree that is
          # actually about to be uploaded; this is the irreversible stage.
          metadata=$(cargo metadata --no-deps --format-version 1)
          versions=$(printf '%s' "$metadata" | jq -r '.packages[] | select(.publish != []) | .version' | sort -u)
          version_count=$(printf '%s\n' "$versions" | wc -l)
          if [ "$version_count" -ne 1 ]; then
            version_list=$(printf '%s' "$versions" | tr '\n' ' ')
            echo "::error::Publishable members disagree on version: ${version_list}"
            exit 1
          fi
          if [ "$versions" != "$VERSION" ]; then
            echo "::error::The commit this release points at has manifest version ${versions}, but this run is publishing ${VERSION}. cargo would upload ${versions} under the tag ${TAG}. Recreate the draft from a commit whose manifests say ${VERSION}."
            exit 1
          fi

      # The verification build runs BEFORE the token exists. `cargo publish`
      # would otherwise do it inside the credential's ~30-minute window, and on
      # a cold cache compiling the publishable crates (rusqlite builds SQLite
      # from C) can consume most of that — expiring the token part-way through
      # the uploads, which is precisely a partial publish. Doing it here leaves
      # only the upload inside the window.
      #
      # The member list is built explicitly rather than using `--workspace`,
      # which packages `publish = false` members too. That is a superset of what
      # `cargo publish --workspace` uploads, in both directions that matter: it
      # drags unpublishable members' dependency trees into the very build this
      # step exists to keep short, and it enforces packaging rules on crates
      # that are never packaged — an unversioned path dependency is legal in a
      # `publish = false` member and fails `cargo package`, so stage 1 would
      # pass and this step would fail after the draft exists.
      - name: Package and verify the publishable members
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          members=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name')
          if [ -z "$members" ]; then
            echo "::error::No publishable workspace members found. Expected at least one."
            exit 1
          fi
          args=()
          while read -r c; do
            [ -n "$c" ] || continue
            args+=(-p "$c")
          done <<< "$members"
          cargo package --locked "${args[@]}"

      # Idempotency guard: makes a run that failed or was cancelled after this
      # point safe to re-dispatch at the same version. `cargo publish
      # --workspace` is not itself idempotent — re-uploading an already-published
      # member errors immediately and aborts the whole multi-package publish, so
      # without this a partial publish could only be finished by hand (see
      # Recovery in CONTRIBUTING.md).
      #
      # Uses the crates.io JSON API (`crate-state.sh`), not the sparse index:
      # the index is CDN-cached for 600s, and a re-dispatch after a cancelled
      # run can land seconds after the prior attempt's uploads. Every branch
      # fails closed — a wrong "absent" verdict would try to re-publish a
      # member that is already live, and a wrong "published" verdict would
      # skip one that never went out, leaving the release incomplete.
      - name: Classify crates.io state for every publishable member
        id: crate_state
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # `$(...)` in a plain assignment, not inside a `[` test — `set -e`
          # aborts on that, which is what makes publishable-members.sh's own
          # fail-closed refusal fatal here instead of an empty member list.
          members=$(.github/scripts/publishable-members.sh)

          already=""
          pending=""
          total=0
          for c in $members; do
            total=$((total + 1))
            state=$(.github/scripts/crate-state.sh "$c" "$VERSION")
            case "$state" in
              published) already="$already $c" ;;
              absent) pending="$pending $c" ;;
              yanked)
                echo "::error::$c ${VERSION} is published but YANKED — that version slot is spent for good."
                echo "::error::Re-running cannot fix this. Follow the Recovery section (abandon-and-bump path) in CONTRIBUTING.md."
                exit 1
                ;;
              *)
                echo "::error::Unrecognized state '$state' for $c — refusing to continue."
                exit 1
                ;;
            esac
          done

          already="${already# }"
          pending="${pending# }"
          echo "already_published=$already" >> "$GITHUB_OUTPUT"
          if [ -z "$pending" ]; then
            echo "all_published=true" >> "$GITHUB_OUTPUT"
            echo "All $total publishable members are already at ${VERSION}; finishing the release without publishing again."
          else
            echo "all_published=false" >> "$GITHUB_OUTPUT"
            echo "Already at ${VERSION}: ${already:-none}. Publishing the rest: ${pending}."
          fi

      - name: Mint a short-lived crates.io token by OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.crate_state.outputs.all_published != 'true'
        timeout-minutes: 5

      - name: Publish the workspace to crates.io
        if: steps.crate_state.outputs.all_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          ALREADY_PUBLISHED: ${{ steps.crate_state.outputs.already_published }}
        # cargo 1.90+ publishes multiple workspace members in topological order
        # (skuld-macros, then skuld, then cargo-skuld), waiting for each to
        # appear on the sparse index before the next. `--exclude` drops
        # whichever ones the guard step above found already `published` at this
        # version — cargo then resolves them from the registry like any other
        # dependency, since they are genuinely there.
        #
        # `--no-verify` because the packaging step above already ran the
        # verification build, on this commit and over the whole member set —
        # that is what keeps the token window down to the uploads. Stage 1's
        # dry-run is not the justification: it runs against `github.sha`, while
        # this job builds the draft's target, and those can differ (which is
        # why the flip below re-asserts the SHA). What `--no-verify` does skip
        # is the registry-side checks cargo makes at upload time, such as the
        # size cap.
        shell: bash
        run: |
          set -euo pipefail
          args=(--workspace --locked --no-verify)
          for c in $ALREADY_PUBLISHED; do
            args+=(--exclude "$c")
          done
          cargo publish "${args[@]}"

      # No `if:` — this runs even when the guard step above found every member
      # already published, so a re-dispatch that only needs to finish the flip
      # (see Recovery in CONTRIBUTING.md) still completes the release.
      - name: Publish GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Re-assert the target. The flip is what creates the tag, and it uses
          # the release's target as it stands *now* — an edit to the draft
          # between the earlier resolution and this point would otherwise tag a
          # commit nobody verified. Pin it to the SHA this run actually built.
          gh release edit "$TAG" --draft=false --target "$COMMIT_SHA"

          # Completion marker, to both the log and the summary: the operator is
          # told to read the log, and the summary is what a reader sees first.
          #
          # `crates-io-auth-action` revokes its minted token in a post step, and
          # fails the job if that revoke fails — post steps run after every
          # regular step, so after this one. A red run carrying this marker is a
          # finished release: take no action.
          echo "RELEASE COMPLETE: $TAG published to crates.io and GitHub — https://github.com/${REPO}/releases/tag/$TAG. If this run is red, the failure came after this point and the release is done." \
            | tee -a "$GITHUB_STEP_SUMMARY"
