name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    # The Deploy environment is named in each crate's crates.io trusted-publisher
    # config, so the OIDC token minted below is only accepted from a run that
    # declares it. It also enforces any environment protection rules (required
    # reviewers, wait timers) configured in the repo.
    #
    # Real preflight (version validation, CI matrix, cargo publish dry-run)
    # happens in draft-release.yaml before a draft can exist. This workflow
    # assumes the operator has already reviewed the draft and is committing
    # to publishing — so we don't duplicate preflight here.
    environment: Deploy
    permissions:
      # `write` is required (not just `read`) so the List releases API
      # returns drafts: per GitHub docs, drafts are only returned "if the
      # user has push access", which means write-level auth.
      contents: write
      # Lets the runner mint the OIDC JWT that crates.io exchanges for a
      # short-lived publish token. Both scopes must be listed: declaring any
      # `permissions:` block sets every unlisted scope to `none`.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Normalize and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          V="${INPUT_VERSION#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: '${INPUT_VERSION}'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - name: Verify draft release exists and resolve commit SHA
        id: release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! RELEASE_JSON=$(gh release view "$TAG" --json isDraft,targetCommitish); then
            echo "::error::gh release view failed for $TAG. Does the draft release exist?"
            exit 1
          fi

          IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release $TAG is already published"
            exit 1
          fi

          TARGET=$(echo "$RELEASE_JSON" | jq -r '.targetCommitish')
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Draft release target '$TARGET' is not a 40-char commit SHA. Recreate the draft via the Draft Release workflow."
            exit 1
          fi
          echo "commit_sha=$TARGET" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.commit_sha }}
          # fetch-depth: 0 so `cargo xtask version --check --exact` sees
          # all ancestor tags, not just the one we're about to create.
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust

      - name: Re-verify workspace version matches release
        # Belt-and-suspenders: the checked-out commit's Cargo.toml must agree
        # with the version being published.
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$TAG"
          cargo xtask version --check --exact

      # `crates-io-auth-action`'s post step can fail the job after the publish
      # already succeeded. Without this check the obvious response — re-dispatch
      # — fails again on "crate version already exists", so a finished release
      # looks broken twice. The sparse index is used rather than the JSON API
      # because the latter answers 403 to a request without a User-Agent.
      - name: Check whether this version is already on crates.io
        id: crates_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          published=0 absent=0 names=""
          while read -r c; do
            names="$names $c"
            prefix=$(printf '%s' "$c" | sed -E 's|^(..)(..).*|\1/\2|')
            if curl -sfX GET "https://index.crates.io/$prefix/$c" | grep -q "\"vers\":\"${VERSION}\""; then
              published=$((published + 1))
            else
              absent=$((absent + 1))
            fi
          done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name')

          if [ "$absent" -eq 0 ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "All of$names are already at ${VERSION}; skipping publish and finishing the release."
          elif [ "$published" -eq 0 ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Partial publish: $published of $((published + absent)) members are at ${VERSION}."
            echo "::error::Re-running cannot fix this. Follow the Recovery section of CONTRIBUTING.md."
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.crates_check.outputs.already_published == 'false'

      - name: Publish the workspace to crates.io
        if: steps.crates_check.outputs.already_published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # cargo 1.90+ publishes multiple workspace members in topological order
        # (skuld-macros, then skuld, then cargo-skuld) and waits for each to appear on the
        # sparse index before publishing the next. This replaces the manual
        # publish-wait-publish dance.
        run: cargo publish --workspace --locked

      - name: Publish GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "Release published: https://github.com/${REPO}/releases/tag/$TAG"
