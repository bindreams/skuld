name: Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string
      first-publish-ok:
        description: "Acknowledge that a member is publishing for the first time (its crate scope must be on the Deploy token)"
        required: false
        default: false
        type: boolean

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust

      - name: Normalize and validate version
        id: version
        # inputs.version is passed via env to avoid shell injection on
        # interpolation. GitHub's actionlint specifically flags direct
        # ${{ inputs.* }} interpolation in run: blocks.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          V="${INPUT_VERSION#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: '${INPUT_VERSION}'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Fail if release tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists (draft or published). Delete it or pick a new version."
            exit 1
          fi

      - name: Create local tag for xtask check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git tag "v${VERSION}"

      - name: Validate workspace version and dep pin against tag
        # Runs workspace_version() (version agreement + every intra-workspace pin) AND
        # nearest-tag comparison with --exact. Fails on any inconsistency.
        # Catches operator mistypes: if input version != Cargo.toml version,
        # the newly-created local tag disagrees with Cargo.toml and --exact
        # rejects it.
        run: cargo xtask version --check --exact

  ci:
    name: CI
    needs: validate
    # Re-run the full CI matrix (lint + 6-platform test) against the release
    # commit. Main's last green CI does not imply THIS commit is green — it
    # might be behind main, and pushes to main between CI runs may have
    # landed broken. Stage 1 is the last reversible gate before publish.
    uses: ./.github/workflows/ci.yaml

  verify:
    name: Verify publishable
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - name: Dry-run publish workspace
        # cargo 1.90+ dry-runs multi-package publishes in topological order.
        #
        # Verification stays on. Multi-package publishing — `--workspace` or
        # `-p a -p b` alike — builds a temporary overlay registry from the
        # packaged siblings, so each crate's verify step resolves its
        # intra-workspace deps without them being on crates.io. Keeping verification on means stage 1 actually rehearses
        # stage 2, compiling each crate as packaged rather than as checked out.
        run: cargo publish --workspace --dry-run --locked

      # `--dry-run` never authenticates, so nothing up to this point has
      # exercised the Deploy token's crate scope — and a member publishing for
      # the first time publishes last, so a scope miss lands the worst partial
      # state. Detect first-publishes here, in the reversible stage, and make
      # the operator confirm the scope rather than discover it mid-upload.
      - name: Flag first-time publishes
        env:
          VERSION: ${{ inputs.version }}
          ACK: ${{ inputs.first-publish-ok }}
        shell: bash
        run: |
          set -euo pipefail
          # Read the member list into a variable rather than piping a process
          # substitution into the loop: `done < <(cargo metadata | jq)` discards
          # the exit status of both commands, so a metadata or jq failure would
          # feed the loop zero names and report every crate as already published.
          # An assignment propagates the failure, and `set -e` stops the step.
          members=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name')
          if [ -z "$members" ]; then
            echo "::error::No publishable workspace members found. Expected at least one."
            exit 1
          fi

          new=()
          while read -r c; do
            prefix=$(printf '%s' "$c" | sed -E 's|^(..)(..).*|\1/\2|')
            curl -sfX GET "https://index.crates.io/$prefix/$c" >/dev/null || new+=("$c")
          done <<< "$members"
          if [ ${#new[@]} -eq 0 ]; then
            echo "All publishable members already exist on crates.io."
          elif [ "$ACK" = "true" ]; then
            echo "::notice::First publish for: ${new[*]} — acknowledged."
          else
            echo "::error::First publish for: ${new[*]}. Confirm the Deploy token's crate scope covers these, then re-run with first-publish-ok=true."
            exit 1
          fi

  release:
    name: Create draft release
    needs: [validate, ci, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release pinned to commit SHA
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --draft \
            --generate-notes \
            --title "v${VERSION}" \
            --target "$SHA"
          echo "Draft release created for commit $SHA:"
          echo "  https://github.com/${REPO}/releases/tag/v${VERSION}"
