name: Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust

      - name: Normalize and validate version
        id: version
        timeout-minutes: 5
        # inputs.version is passed via env to avoid shell injection on
        # interpolation. GitHub's actionlint specifically flags direct
        # ${{ inputs.* }} interpolation in run: blocks.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Reject a leading `v` rather than stripping it. The raw input is the
          # concurrency key, so if `1.2.3` and `v1.2.3` both normalized to one
          # version they would land in *different* groups while naming the same
          # release — two runs of the same publish, in parallel, on an operation
          # that cannot be undone. One accepted spelling keeps key and meaning
          # in step.
          # Leading zeros are rejected too: `01.2.3` is not valid semver, so
          # `semver::Version::parse` fails on it and xtask's tag map silently
          # skips such a tag — the one check tying input to manifest would
          # no-op for exactly those spellings.
          if ! [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version: '${INPUT_VERSION}'. Expected three dot-separated numbers with no leading zeros, no leading 'v', and no pre-release or build suffix (e.g. 1.2.3)."
            exit 1
          fi
          V="$INPUT_VERSION"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Fail if release tag already exists
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists (draft or published). Delete it or pick a new version."
            exit 1
          fi

      - name: Create local tag for xtask check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git tag "v${VERSION}"

      - name: Validate workspace version and dep pin against tag
        # Runs workspace_version() (version agreement + every intra-workspace
        # pin) AND nearest-tag comparison with --exact.
        #
        # This does NOT catch an operator mistyping the version. `--exact` is
        # satisfied by any version tag on the nearest tagged ancestor, so when
        # that commit already carries a tag matching the manifest — main today —
        # the tag created above is just one more alternative and any input
        # passes. The manifest/input comparison in "Check crates.io state" below
        # is what actually catches it.
        run: cargo xtask version --check --exact

  ci:
    name: CI
    needs: validate
    # Re-run the full CI matrix (lint + 6-platform test) against the release
    # commit. Main's last green CI does not imply THIS commit is green — it
    # might be behind main, and pushes to main between CI runs may have
    # landed broken. Stage 1 is the last reversible gate before publish.
    uses: ./.github/workflows/ci.yaml

  verify:
    name: Verify publishable
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - name: Dry-run publish workspace
        timeout-minutes: 30
        # cargo 1.90+ dry-runs multi-package publishes in topological order.
        #
        # Verification stays on. Multi-package publishing — `--workspace` or
        # `-p a -p b` alike — builds a temporary overlay registry from the
        # packaged siblings, so each crate's verify step resolves its
        # intra-workspace deps without them being on crates.io. Keeping verification on means stage 1 actually rehearses
        # stage 2, compiling each crate as packaged rather than as checked out.
        run: cargo publish --workspace --dry-run --locked

      # Two questions must be settled before a draft can exist, and the
      # dry-run above answers neither.
      #
      # A crate that does not yet exist on crates.io cannot have a trusted
      # publisher configured, so stage 2 cannot publish a new member at all —
      # and a leaf publishes after its dependencies, landing the worst partial
      # state. See "Adding a publishable member" in CONTRIBUTING.md.
      #
      # A version already on crates.io can never be published again: the
      # registry reserves it permanently and yanking does not free it.
      # `cargo publish --dry-run` warns "already exists on crates.io" and still
      # exits 0, so without this check a re-dispatch of a published version
      # passes stage 1 and fails part-way through the irreversible upload.
      #
      # Uses `crate-state.sh`, which reads the crates.io JSON API, rather than
      # the sparse index: the index is CDN-cached for 600s, long enough to
      # still read "absent" right after a real upload, which is exactly the
      # state this check exists to catch. `crate-state.sh` fails closed on any
      # ambiguous response instead of guessing.
      - name: Check crates.io state for every publishable member
        timeout-minutes: 10
        env:
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Read the member list into a variable rather than feeding a loop from
          # a process substitution: `< <(cargo metadata | jq)` discards the exit
          # status of both commands, so a failure there would run the loop zero
          # times and report every member as fine — this gate failing open in
          # the stage that exists to catch exactly that.
          metadata=$(cargo metadata --no-deps --format-version 1)
          members=$(printf '%s' "$metadata" | jq -r '.packages[] | select(.publish != []) | .name')
          if [ -z "$members" ]; then
            echo "::error::No publishable workspace members found. Expected at least one."
            exit 1
          fi

          # The version that gets uploaded is the manifest's, not the operator's
          # input, and the two can differ: `cargo xtask version --check --exact`
          # is satisfied by ANY version tag on HEAD, so when main already carries
          # the last release tag it accepts a mistyped input. Checking the input
          # would then clear a version nobody is publishing while the one cargo
          # actually uploads goes unchecked.
          versions=$(printf '%s' "$metadata" | jq -r '.packages[] | select(.publish != []) | .version' | sort -u)
          version_count=$(printf '%s\n' "$versions" | wc -l)
          if [ "$version_count" -ne 1 ]; then
            version_list=$(printf '%s' "$versions" | tr '\n' ' ')
            echo "::error::Publishable members disagree on version: ${version_list}"
            exit 1
          fi
          VERSION="$versions"
          if [ "$VERSION" != "$INPUT_VERSION" ]; then
            echo "::error::Input version ${INPUT_VERSION} does not match the workspace manifest version ${VERSION}; cargo would publish ${VERSION}. Bump the manifests, or re-dispatch with ${VERSION}."
            exit 1
          fi

          new=()
          taken=()
          yanked=()
          while read -r c; do
            [ -n "$c" ] || continue

            # No-version query: never-published means stage 2 could never
            # publish this member at all (see "Adding a publishable member"
            # in CONTRIBUTING.md). `state=$(...)` as a plain assignment, not
            # inside a `[` test — `set -e` sees a failing command substitution
            # there and aborts, which is what makes crate-state.sh's own
            # refusals fatal here instead of silently read as "exists".
            state=$(.github/scripts/crate-state.sh "$c")
            case "$state" in
              exists) ;;
              never-published)
                new+=("$c")
                continue
                ;;
              *)
                echo "::error::Unrecognized state '$state' for $c — refusing to continue."
                exit 1
                ;;
            esac

            # With-version query: crates.io reserves a version permanently on
            # first upload, whether or not it later gets yanked, so both
            # `published` and `yanked` mean this version can never be
            # published again.
            vstate=$(.github/scripts/crate-state.sh "$c" "$VERSION")
            case "$vstate" in
              absent) ;;
              published) taken+=("$c") ;;
              yanked)
                taken+=("$c")
                yanked+=("$c")
                ;;
              *)
                echo "::error::Unrecognized state '$vstate' for $c ${VERSION} — refusing to continue."
                exit 1
                ;;
            esac
          done <<< "$members"

          # Report every problem in one run rather than one per re-dispatch.
          fail=0
          if [ ${#new[@]} -ne 0 ]; then
            echo "::error::Never published: ${new[*]}. Stage 2 authenticates by trusted publishing, and a crate that does not exist cannot have a publisher configured. Follow \"Adding a publishable member\" in CONTRIBUTING.md, then re-run."
            fail=1
          fi
          if [ ${#taken[@]} -ne 0 ]; then
            echo "::error::crates.io already has ${VERSION} for: ${taken[*]}. That version is reserved permanently and can never be republished. Bump and re-run."
            fail=1
          fi
          if [ ${#yanked[@]} -ne 0 ]; then
            echo "::error::Of those, ${yanked[*]} are specifically YANKED at ${VERSION} — that slot is spent for good."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

          echo "All publishable members exist, and none has ${VERSION} yet."

  release:
    name: Create draft release
    needs: [validate, ci, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release pinned to commit SHA
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --draft \
            --generate-notes \
            --title "v${VERSION}" \
            --target "$SHA"
          echo "Draft release created for commit $SHA:"
          echo "  https://github.com/${REPO}/releases/tag/v${VERSION}"
